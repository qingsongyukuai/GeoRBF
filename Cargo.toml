[package]
name = "georbf"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Implicit geological scalar fields from geological observations"
license = "MIT"
repository = "https://github.com/qingsongyukuai/GeoRBF"
include = [
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/RELEASE_NOTES.md",
    "/rust-toolchain.toml",
    "/examples/**",
    "/docs/implementation/16-production-equality-spine.md",
    "/docs/implementation/17-cubic-equality-core.md",
    "/docs/implementation/18-cubic-equality-numerical-policy.md",
    "/docs/implementation/19-public-absolute-field-tracer.md",
    "/docs/implementation/20-shared-level-set-gauge.md",
    "/docs/implementation/21-tangent-direction-observation.md",
    "/docs/implementation/22-equality-builder-problem-snapshot-contract.md",
    "/docs/implementation/23-equality-structured-diagnostics-fit-report.md",
    "/docs/implementation/24-immutable-model-batch-query.md",
    "/docs/implementation/25-equality-spine-release.md",
    "/docs/implementation/27-soft-field-value-objective.md",
    "/docs/implementation/28-soft-first-order-residual-blocks.md",
    "/docs/implementation/29-cubic-convex-qp-execution.md",
    "/docs/implementation/30-field-value-bounds.md",
    "/docs/implementation/31-directional-derivative-intervals.md",
    "/docs/implementation/32-stratigraphic-level-relations.md",
    "/docs/implementation/33-level-set-affine-relations.md",
    "/docs/implementation/34-normal-direction-workflow.md",
    "/docs/implementation/35-convex-relations-verification-closure.md",
    "/validation/oracle/cubic-v1/**",
    "/validation/v0.1.0/**",
]

[dependencies]
clarabel = { version = "=0.11.1", default-features = false, features = ["serde"] }
faer = { version = "=0.24.4", default-features = false, features = ["linalg", "std"] }

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
