[package]
name = "georbf"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Implicit geological scalar fields from geological observations"
license = "MIT"
repository = "https://github.com/qingsongyukuai/GeoRBF"
include = [
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/rust-toolchain.toml",
    "/docs/implementation/16-production-equality-spine.md",
    "/docs/implementation/17-cubic-equality-core.md",
    "/docs/implementation/18-cubic-equality-numerical-policy.md",
    "/docs/implementation/19-public-absolute-field-tracer.md",
    "/docs/implementation/20-shared-level-set-gauge.md",
    "/docs/implementation/21-tangent-direction-observation.md",
    "/docs/implementation/22-equality-builder-problem-snapshot-contract.md",
    "/docs/implementation/23-equality-structured-diagnostics-fit-report.md",
    "/docs/implementation/24-immutable-model-batch-query.md",
    "/validation/oracle/cubic-v1/**",
]

[dependencies]
faer = { version = "=0.24.4", default-features = false, features = ["linalg", "std"] }

[dev-dependencies]
proptest = { version = "=1.6.0", default-features = false, features = ["std"] }
